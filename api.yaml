  # ---------- 移动端解锁和缩放动作 ----------
  # unlock_screen - 解锁屏幕（iOS/Android/Harmony 平台）
  # 检测设备锁屏状态并自动解锁，使用固定坐标点击密码键盘
  # 配置：密码键盘坐标在 config/worker.yaml 的 unlock 配置中设置
  # iOS 锁屏检测：GET /wda/locked
  # Android 锁屏检测：device.info['screenOn']
  # 执行流程：检测锁屏 → 唤醒屏幕 → 滑动解锁 → 输入密码 → 验证解锁
  # 示例 1: 解锁 iOS 设备，密码 123456
  # {"action_type": "unlock_screen", "value": "123456"}
  # 示例 2: 解锁 Android 设备，密码 123456
  # {"action_type": "unlock_screen", "value": "123456"}
  # 示例 3: 解锁鸿蒙设备，密码 123456
  # {"action_type": "unlock_screen", "value": "123456"}

  # pinch - 移动端双指缩放（Android/iOS）
  # value: "in" 表示缩小，"out" 表示放大
  # params.scale: 缩放比例，默认 0.5；params.duration: 持续时间，默认 500ms
  # {"action_type": "pinch", "value": "out", "params": {"scale": 0.5, "duration": 500}}

  # ---------- 窗口激活动作 ----------
  # activate_window - 激活窗口（Windows/Mac/Web 平台）
  # 将指定窗口带到前台并获取焦点，支持按标题或窗口类名定位
  # 示例 1: 按窗口标题激活（包含匹配）
  # {"action_type": "activate_window", "value": "计算器"}
  # 示例 2: 按窗口类名激活 Chrome 浏览器
  # {"action_type": "activate_window", "value": "Chrome_WidgetWin_1", "match_by": "class"}
  # 示例 3: 按窗口类名激活，限制只找 chrome.exe 进程（避免误激活 Edge）
  # {"action_type": "activate_window", "value": "Chrome_WidgetWin_1", "match_by": "class", "name": "chrome.exe"}
  # 示例 4: 按窗口类名激活，限制只找 msedge.exe 进程（激活 Edge）
  # {"action_type": "activate_window", "value": "Chrome_WidgetWin_1", "match_by": "class", "name": "msedge.exe"}
  # 示例 5: Mac 激活应用（使用 class 模式，即应用名）
  # {"action_type": "activate_window", "value": "Calculator", "match_by": "class"}

  # ---------- 关闭窗口动作 ----------
  # close_window - 关闭指定窗口/弹窗（Windows/Web 平台）
  # 通过 PostMessage(WM_CLOSE) 请求窗口关闭；找不到窗口或关闭后仍存在则 FAILED
  # 示例 1: 按标题关闭（包含匹配）
  # {"action_type": "close_window", "value": "声音"}
  # 示例 2: 按窗口类名关闭
  # {"action_type": "close_window", "value": "#32770", "match_by": "class"}
  # 示例 3: class + title 双条件（推荐，避免 #32770 误关其他对话框）
  # {"action_type": "close_window", "value": "声音", "window_class": "#32770"}
  # 示例 4: 再加进程过滤
  # {"action_type": "close_window", "value": "声音", "window_class": "#32770", "name": "rundll32.exe"}


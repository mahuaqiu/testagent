  # ---------- 录屏动作 ----------
  # start_recording - 启动录屏（仅 Windows 平台）
  # 使用 windows-screen-sidecar 硬件编码录制屏幕，支持时间水印
  # value: 输出路径，支持两种格式：
  #   - 目录路径（如 "d:/temp"）→ 自动生成文件名 recording_YYYYMMDD_HHMMSS.mp4
  #   - 文件路径（如 "d:/temp/test.mp4"）→ 直接使用
  #   - 为空时使用默认配置目录 + 自动生成文件名
  # fps: 帧率（可选，默认 10）
  # audio: 是否录制音频（可选，默认 false）
  # watermark: 是否开启时间水印（可选，默认 true）
  # recording_timeout: 录屏超时时间（毫秒，可选，默认 7200000，即 2 小时）
  # monitor: 显示器选择（可选，默认 1，主屏幕）
  # 示例 1: 启动录制，保存到指定文件
  # {"action_type": "start_recording", "value": "d:/temp/test.mp4"}
  # 示例 2: 启动录制，指定帧率和音频
  # {"action_type": "start_recording", "value": "d:/temp/test.mp4", "fps": 15, "audio": true}
  # 示例 3: 启动不带水印的录制
  # {"action_type": "start_recording", "value": "d:/temp/test.mp4", "watermark": false}
  # 示例 4: 使用目录路径（自动生成文件名）
  # {"action_type": "start_recording", "value": "d:/temp"}
  # 示例 5: 使用默认配置目录（自动生成文件名）
  # {"action_type": "start_recording"}

  # stop_recording - 停止录屏（仅 Windows 平台）
  # 幂等操作：可多次调用，不会报错
  # 示例: 停止当前录制
  # {"action_type": "stop_recording"}

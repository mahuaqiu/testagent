# Worker API 接口说明
# Base URL: http://{host}:{port} (默认端口 8080)

openapi: "3.0.0"
info:
  title: "Test Worker API"
  description: "多端自动化测试执行基建 API"
  version: "5.0.0"

servers:
  - url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
      port:
        default: "8080"

paths:
  /worker_devices:
    get:
      summary: "获取 Worker 状态和设备信息"
      description: "获取 Worker 状态及所有连接设备信息"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDevicesResponse"
              example:
                status: "online"
                started_at: "2026-03-14T10:00:00.000000"
                supported_platforms: ["web", "windows", "android", "ios", "harmony_mobile", "harmony_pc"]
                ip: "192.168.1.10"
                port: 8080
                version: "3.0.0"
                devices:
                  web: []
                  windows: []
                  mac: []
                  android:
                    - device_id: "emulator-5554"
                      platform: "android"
                      connection_status: "connected"
                      service_status: "ready"
                      health_status: "healthy"
                  ios:
                    - device_id: "00008030-001234567890ABCD"
                      platform: "ios"
                      connection_status: "connected"
                      service_status: "ready"
                      health_status: "healthy"
                  harmony_mobile: []
                  harmony_pc: []
                faulty_devices:
                  android: []
                  ios: []
                  harmony_mobile: []
                  harmony_pc: []
                namespace: ""
                config_version: "20260805-120000"
                scripts: {}
        "503":
          description: "Worker 未初始化"

  /task/execute:
    post:
      summary: "同步执行任务"
      description: "同步执行自动化测试任务，阻塞等待结果返回，不生成 task_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
            example:
              platform: "web"
              actions:
                - action_type: "navigate"
                  value: "https://example.com"
                - action_type: "ocr_click"
                  value: "登录"
                - action_type: "screenshot"
                  value: "result"
              device_id: null
      responses:
        "200":
          description: "任务执行完成（不包含 task_id）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "400":
          description: "任务参数、平台或动作不合法"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerError"
        "409":
          description: "目标设备或平台忙碌"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerError"
        "503":
          description: "Worker 未初始化"

  /task/execute_async:
    post:
      summary: "异步执行任务"
      description: "异步提交自动化测试任务，立即返回 task_id；使用 Idempotency-Key 保证网络重试不会重复创建任务"
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
          description: "可选幂等键；提供后，同一次逻辑提交及其网络重试必须复用同一个键，不同主动调用必须使用不同键"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
            example:
              platform: "web"
              actions:
                - action_type: "navigate"
                  value: "https://example.com"
                - action_type: "ocr_click"
                  value: "登录"
      responses:
        "200":
          description: "任务已提交"
          content:
            application/json:
              example:
                task_id: "task_20260317_120000_abc123"
                status: "running"
                request_id: "req_20260317_120000_abc123"
        "409":
          description: "设备/平台冲突"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerError"
              example:
                detail:
                  code: "DEVICE_BUSY"
                  message: "Device/Platform is busy"
                  retryable: true
                  details: {}
        "400":
          description: "任务参数、平台或动作不合法"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerError"
        "503":
          description: "Worker 未初始化"

  /task/{task_id}:
    get:
      summary: "查询任务结果"
      description: "根据任务 ID 查询任务快照，可重复轮询；任务在保留期到期前不会因查询被删除"
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "任务状态或结果"
          content:
            application/json:
              examples:
                running:
                  summary: "执行中"
                  value:
                    task_id: "task_20260317_120000_abc123"
                    status: "running"
                    request_id: "req_20260317_120000_abc123"
                terminal:
                  summary: "执行完成"
                  value:
                    task_id: "task_20260317_120000_abc123"
                    status: "success"
                    platform: "web"
                    duration_ms: 1500
                    actions: []
                    metadata: {}
                    artifacts: []
                    request_id: "req_20260317_120000_abc123"
                    started_at: "2026-03-17T12:00:00.000000"
                    finished_at: "2026-03-17T12:00:01.500000"
        "404":
          description: "任务不存在"
          content:
            application/json:
              example:
                detail:
                  code: "TASK_NOT_FOUND"
                  message: "Task not found"
                  retryable: false
                  details: {}
        "503":
          description: "Worker 未初始化"

    delete:
      summary: "取消任务"
      description: "请求取消任务；活动任务返回 cancelling，资源释放后通过 GET 观察到 cancelled，终态任务重复取消时返回当前终态"
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "取消成功"
          content:
            application/json:
              example:
                task_id: "task_20260317_120000_abc123"
                status: "cancelling"
        "404":
          description: "任务不存在"
          content:
            application/json:
              example:
                detail:
                  code: "TASK_NOT_FOUND"
                  message: "Task not found"
                  retryable: false
                  details: {}
        "503":
          description: "Worker 未初始化"


  /ws/screen/{platform}/{device_id}:
    get:
      summary: "实时屏幕 WebSocket 推流"
      description: |
        通过 WebSocket 推送设备屏幕帧。该路由实际使用 WebSocket 握手，OpenAPI 仅用于描述连接参数。
        codec 支持 jpeg、h264、mjpeg；Windows 的 h264 优先使用 RSM1 二进制媒体通道，
        iOS 的 mjpeg 使用设备 MJPEG 透传，Windows 不支持 mjpeg，iOS/Android 不支持 h264 时回退为 jpeg。
        鸿蒙设备仅支持 jpeg，h264/mjpeg 会回退为 jpeg。
        首帧门控保证新连接先收到解码所需的 SPS/PPS 和可信真实 IDR，丢弃暖机黑帧、暖机 P 帧及不可独立解码的 P 帧。
      x-websocket: true
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android, windows, mac, web, harmony_mobile, harmony_pc]
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: monitor
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: "桌面端显示器索引；移动端忽略"
        - name: codec
          in: query
          required: false
          schema:
            type: string
            enum: [jpeg, h264, mjpeg]
            default: jpeg
      responses:
        "101":
          description: "WebSocket 升级成功"
        "1008":
          description: "参数、平台、设备或连接数不满足要求"
  /devices/refresh:
    post:
      summary: "刷新设备列表"
      description: "重新扫描并更新设备列表"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDevicesResponse"
              example:
                status: "online"
                supported_platforms: ["web", "windows", "android", "ios", "harmony_mobile", "harmony_pc"]
                devices:
                  web: []
                  windows: []
                  mac: []
                  android: []
                  ios: []
                  harmony_mobile: []
                  harmony_pc: []
                faulty_devices:
                  android: []
                  ios: []
                  harmony_mobile: []
                  harmony_pc: []
                namespace: ""
                config_version: "20260805-120000"
                scripts: {}
        "503":
          description: "Worker 未初始化"

  /worker/logs:
    get:
      summary: "查询 Worker 日志"
      description: |
        获取 Worker 日志内容。查询模式互斥：
        - 仅传 lines：返回最后 N 行，默认 400 行
        - 仅传 request_id：搜索当前日志及轮转日志中的请求链路
        - 同时传 start_time 和 end_time：按 ISO 8601 时间区间过滤，区间最长 5 分钟
      parameters:
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 400
          description: "返回的日志行数"
        - name: request_id
          in: query
          required: false
          schema:
            type: string
          description: "按请求追踪 ID 查询日志"
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "时间区间起始（ISO 8601 格式，必须与 end_time 同时传入）"
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "时间区间结束（ISO 8601 格式，必须与 start_time 同时传入）"
      responses:
        "200":
          description: "日志文本"
          headers:
            X-Log-Count:
              description: "返回的日志行数"
              schema:
                type: integer
            X-Files-Scanned:
              description: "扫描的日志文件数"
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: "查询参数组合或时间区间无效"
        "404":
          description: "日志路径未配置或日志文件不存在"
        "503":
          description: "Worker 未初始化"

  /worker/upgrade:
    post:
      summary: "异步升级 Worker"
      description: "接受升级请求后立即返回，升级进度通过 GET /worker/upgrade/status 查询。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "200":
          description: "升级请求已接受、跳过或拒绝"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeResponse"
        "503":
          description: "Worker 未初始化"

  /worker/upgrade/status:
    get:
      summary: "查询 Worker 升级状态"
      description: "查询当前升级任务；没有升级任务时返回 status=none。"
      responses:
        "200":
          description: "升级状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeState"

  /worker/config:
    post:
      summary: "更新 Worker 配置"
      description: |
        更新完整 YAML 配置。版本号必须为 YYYYMMDD-HHMMSS；更新成功后会异步触发 Worker 重启，
        本地 IP 和设备发现配置由 Worker 保留，不会被远端配置覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdateRequest"
      responses:
        "200":
          description: "配置版本相同或更新成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResult"
        "400":
          description: "版本号或 YAML 配置无效"
        "409":
          description: "已有配置更新正在进行"
        "500":
          description: "配置保存失败"
        "503":
          description: "Worker 未初始化"

  /worker/scripts:
    post:
      summary: "更新 Worker 脚本"
      description: |
        下发单个 Worker 工具脚本。脚本名只允许 .ps1、.sh、.bat 扩展名且禁止路径穿越；
        更新脚本不会触发 Worker 重启，成功后会重新上报脚本版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptUpdateRequest"
      responses:
        "200":
          description: "脚本版本相同或更新成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResult"
        "400":
          description: "版本号、脚本名称或脚本内容无效"
        "409":
          description: "已有脚本更新正在进行，或 overwrite=false 且脚本已存在"
        "500":
          description: "脚本保存失败"
        "503":
          description: "Worker 未初始化"

  /api/worker/{device_id}/processes:
    get:
      summary: "获取设备进程列表"
      description: |
        获取性能采集选择器使用的进程列表。Windows 可用 search 过滤进程名；
        鸿蒙设备必须同时提供 device_type 和 device_sn，用 HDC UDID 定位设备。
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: "Worker 注册的设备 ID"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: "Windows 进程名模糊搜索"
        - name: device_type
          in: query
          required: false
          schema:
            type: string
            enum: [windows, harmony_pc, harmony_mobile]
          description: "性能采集设备类型；不传时兼容 Windows"
        - name: device_sn
          in: query
          required: false
          schema:
            type: string
          description: "设备物理标识；鸿蒙为 HDC UDID"
      responses:
        "200":
          description: "进程列表"
          content:
            application/json:
              schema:
                type: object
                required: [processes]
                properties:
                  processes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcessInfo"
        "400":
          description: "设备类型或进程查询参数无效"
        "404":
          description: "鸿蒙设备未在 Worker 注册表中"
        "409":
          description: "设备当前不在线或不健康"
        "503":
          description: "Worker 未初始化"

  /api/worker/{device_id}/collect/start:
    post:
      summary: "开始性能数据采集"
      description: "启动指定设备的定时性能采集并上报。单台设备同一时间只允许一个采集任务。"
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: "Worker 注册的设备 ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectStartRequest"
      responses:
        "200":
          description: "采集已开始或已存在"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectOperationResult"
        "409":
          description: "设备已有不同采集任务或正在停止上一任务"
        "503":
          description: "Worker 未初始化或采集后端不可用"

  /api/worker/{device_id}/collect/stop:
    post:
      summary: "停止性能数据采集"
      description: "停止当前采集；请求体可为空，不传 collect_id 时停止该设备当前采集任务。"
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: "Worker 注册的设备 ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectStopRequest"
      responses:
        "200":
          description: "采集已停止或当前无采集任务"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectOperationResult"
        "409":
          description: "collect_id 与当前采集任务不匹配"
        "503":
          description: "Worker 未初始化"

  /api/worker/{device_id}/collect/status:
    get:
      summary: "查询性能采集状态"
      description: "查询设备当前采集状态；Worker 重连后可用此接口恢复采集状态。"
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
          description: "Worker 注册的设备 ID"
        - name: device_type
          in: query
          required: false
          schema:
            type: string
            enum: [windows, harmony_pc, harmony_mobile]
          description: "设备类型"
        - name: device_sn
          in: query
          required: false
          schema:
            type: string
          description: "设备物理标识；鸿蒙为 HDC UDID"
      responses:
        "200":
          description: "采集状态"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectStatus"
        "400":
          description: "设备类型或身份参数无效"
        "404":
          description: "鸿蒙设备未在 Worker 注册表中"
        "409":
          description: "设备当前不在线、不健康或采集身份冲突"
        "503":
          description: "Worker 未初始化"

components:
  schemas:
    ConfigUpdateRequest:
      type: object
      required: [config_content, config_version]
      properties:
        config_content:
          type: string
          description: "完整的 YAML 配置文件内容"
        config_version:
          type: string
          pattern: "^\\d{8}-\\d{6}$"
          description: "配置版本号，格式：YYYYMMDD-HHMMSS"

    ScriptUpdateRequest:
      type: object
      required: [name, content, version]
      properties:
        name:
          type: string
          description: "脚本文件名，只允许 .ps1/.sh/.bat，禁止路径穿越"
        content:
          type: string
          description: "脚本内容"
        version:
          type: string
          pattern: "^\\d{8}-\\d{6}$"
          description: "脚本版本号，格式：YYYYMMDD-HHMMSS"
        overwrite:
          type: boolean
          default: true
          description: "是否覆盖已有脚本"

    UpgradeRequest:
      type: object
      required: [download_url]
      properties:
        download_url:
          type: string
          format: uri
          description: "安装包下载地址"
        version:
          type: string
          nullable: true
          description: "目标版本号，可选"
        force:
          type: boolean
          default: true
          description: "是否强制升级"

    UpgradeResponse:
      type: object
      properties:
        status:
          type: string
          enum: [upgrading, accepted, skipped, rejected]
        message:
          type: string
        current_version:
          type: string
          nullable: true
        target_version:
          type: string
          nullable: true

    UpgradeState:
      type: object
      properties:
        status:
          type: string
          enum: [none, accepted, downloading, installing, completed, failed]
        message:
          type: string
          description: "没有升级任务时返回的提示信息"
        target_version:
          type: string
          nullable: true
        current_version:
          type: string
          nullable: true
        download_url:
          type: string
          nullable: true
        download_progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        downloaded_bytes:
          type: integer
          minimum: 0
          nullable: true
        total_bytes:
          type: integer
          minimum: 0
          nullable: true
        error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    UpdateResult:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        updated:
          type: boolean
        name:
          type: string
        version:
          type: string
        config_version:
          type: string
        path:
          type: string
        restart_triggered:
          type: boolean

    WorkerDevicesResponse:
      type: object
      required: [status, started_at, supported_platforms, ip, port, devices, faulty_devices, device_namespaces, config_version, scripts]
      properties:
        status:
          type: string
          enum: [offline, online, busy]
        started_at:
          type: string
          format: date-time
        supported_platforms:
          type: array
          items:
            type: string
          description: "当前宿主机支持的平台"
        ip:
          type: string
        port:
          type: integer
        version:
          type: string
          nullable: true
        devices:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        faulty_devices:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        device_namespaces:
          type: object
          description: "设备实际注册的命名空间；桌面平台为字符串，移动设备为 device_id 到 namespace 的映射"
          additionalProperties:
            oneOf:
              - type: string
              - type: object
                additionalProperties:
                  type: string
        config_version:
          type: string
        scripts:
          type: object
          additionalProperties:
            type: string

    ProcessInfo:
      type: object
      required: [name, pid]
      properties:
        name:
          type: string
          description: "进程名"
        pid:
          type: integer
          description: "进程 ID"
        cpu_usage:
          type: number
          format: float
          default: 0
          description: "CPU 使用率（%）"
        memory_usage:
          type: number
          format: float
          default: 0
          description: "内存使用量（MB）"
        gpu_usage:
          type: number
          format: float
          default: 0
          description: "GPU 使用率（%）"

    TargetProcess:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "进程名；鸿蒙为应用包名"
        pids:
          type: array
          items:
            type: integer
          nullable: true
          description: "指定 PID 列表；不传或为空时采集该进程名下所有实例"

    CollectStartRequest:
      type: object
      required: [collect_id]
      properties:
        collect_id:
          type: string
          description: "采集记录 ID（由后端生成）"
        interval:
          type: integer
          minimum: 1
          maximum: 1800
          default: 5
          description: "采集频率（秒）"
        timeout:
          type: integer
          minimum: 60
          maximum: 86400
          default: 43200
          description: "采集超时时间（秒），默认 12 小时"
        target_processes:
          type: array
          items:
            $ref: "#/components/schemas/TargetProcess"
          description: "目标进程列表；空列表表示只采集系统指标"
        device_type:
          type: string
          nullable: true
          enum: [windows, harmony_pc, harmony_mobile]
          description: "设备类型；鸿蒙必须显式传入"
        device_sn:
          type: string
          nullable: true
          description: "设备物理标识；鸿蒙为 HDC UDID"

    CollectStopRequest:
      type: object
      properties:
        collect_id:
          type: string
          nullable: true
          description: "采集记录 ID；不传则停止当前所有采集"
        device_type:
          type: string
          nullable: true
          enum: [windows, harmony_pc, harmony_mobile]
          description: "设备类型"
        device_sn:
          type: string
          nullable: true
          description: "设备物理标识；鸿蒙为 HDC UDID"

    CollectOperationResult:
      type: object
      properties:
        status:
          type: string
          enum: [started, already_started, stopped, conflict, error]
        message:
          type: string

    CollectStatus:
      type: object
      required: [is_collecting, state]
      properties:
        is_collecting:
          type: boolean
          description: "是否正在采集"
        collect_id:
          type: string
          nullable: true
          description: "当前采集 ID"
        interval:
          type: integer
          nullable: true
          description: "采集频率（秒）"
        target_processes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TargetProcess"
          description: "目标进程列表"
        start_time:
          type: string
          format: date-time
          nullable: true
          description: "采集开始时间"
        elapsed_seconds:
          type: integer
          nullable: true
          description: "已采集时长（秒）"
        state:
          type: string
          enum: [idle, running]
          description: "采集状态"
        last_sequence:
          type: integer
          nullable: true
          description: "最后已读取的采样序号"
        last_elapsed_ms:
          type: integer
          nullable: true
          description: "最后样本相对时间（毫秒）"

    ArtifactRef:
      type: object
      required: [artifact_id, task_id, type, mime_type, path, size, sha256, created_at, expires_at]
      properties:
        artifact_id:
          type: string
          description: "附件 ID"
        task_id:
          type: string
          description: "所属任务 ID"
        action_number:
          type: integer
          nullable: true
          description: "所属动作序号"
        type:
          type: string
          description: "附件类型，如 screenshot、recording、error_screenshot"
        mime_type:
          type: string
        path:
          type: string
          description: "Worker 附件目录下的相对路径"
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    TaskRequest:
      type: object
      required:
        - platform
        - actions
      properties:
        platform:
          type: string
          enum: [web, android, ios, windows, mac, harmony_mobile, harmony_pc]
          description: |
            目标平台，支持以下值：
            - web: Web 浏览器自动化（Playwright）
            - android: Android 设备自动化（uiautomator2 直连）
            - ios: iOS 设备自动化（tidevice3 + WDA 直连）
            - windows: Windows 桌面自动化（pyautogui）
            - mac: macOS 桌面自动化（pyautogui）
            - harmony_mobile: 鸿蒙移动设备自动化（HDC 直连）
            - harmony_pc: 鸿蒙 PC 设备自动化（HDC 直连）
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
          description: "动作列表，按顺序依次执行"
        device_id:
          type: string
          description: |
            设备 ID，移动端必填：
            - Web/Windows/Mac: 不需要填写
            - Android: 填写设备序列号，如 "emulator-5554"
            - iOS: 填写设备 UDID，如 "00008030-001234567890ABCD"
            - harmony_mobile/harmony_pc: 填写 Worker 注册的鸿蒙设备 UDID
        window:
          $ref: "#/components/schemas/WindowSpec"
      example:
        platform: "web"
        actions:
          - action_type: "navigate"
            value: "https://example.com"
          - action_type: "ocr_click"
            value: "登录"
            offset:
              x: 0
              y: 0
          - action_type: "screenshot"
            value: "result"
        # window 参数示例（Windows 平台窗口级截图）
        # window:
        #   title: "华为云会议"

    WindowSpec:
      type: object
      description: |
        窗口定位参数（Windows 平台），用于窗口级截图。
        传了 title 或 class 就会匹配，不传则全屏截图。
        使用场景：桌面图标/其他窗口太多导致 OCR 识别不准时，通过绑定特定窗口，只截取该窗口区域。
      properties:
        title:
          type: string
          description: "窗口标题（包含匹配），如 '华为云会议'"
        class:
          type: string
          description: "窗口类名（精确匹配），如 'HwmMainWndClass'"
      example:
        title: "华为云会议"

    Action:
      type: object
      required:
        - action_type
      properties:
        action_type:
          type: string
          enum:
            - ocr_click
            - ocr_input
            - ocr_wait
            - ocr_assert
            - ocr_get_text
            - ocr_move
            - ocr_double_click
            - ocr_exist
            - ocr_click_same_row_text
            - ocr_click_same_row_image
            - ocr_check_same_row_text
            - ocr_check_same_row_image
            - image_click
            - image_wait
            - image_assert
            - image_click_near_text
            - image_move
            - image_double_click
            - image_exist
            - click
            - right_click
            - double_click
            - move
            - swipe
            - input
            - paste
            - press
            - screenshot
            - wait
            - start_app
            - stop_app
            - navigate
            - new_page
            - switched_page
            - close_page
            - ocr_get_position
            - image_get_position
            - cmd_exec
            - get_token
            - unlock_screen
            - pinch
            - drag
            - activate_window
            - close_window
            - set_resolution
            - set_volume
            - audio_device
            - start_recording
            - stop_recording
          description: |
            动作类型，分为以下几类：

            【OCR 文字识别动作】
            - ocr_click: 点击屏幕上识别到的文字
            - ocr_input: 在识别到的文字附近输入文本
            - ocr_wait: 等待指定文字出现
            - ocr_assert: 断言指定文字存在或不存在（negate: true 时断言不存在），支持 list 传参批量验证多个文字
            - ocr_get_text: 获取屏幕上所有文字
            - ocr_move: 移动鼠标到识别到的文字位置（仅桌面端）
            - ocr_double_click: 双击屏幕上识别到的文字
            - ocr_exist: 检查文字是否存在，返回 {"exists": true/false}，始终返回 SUCCESS 状态，支持 list 传参批量检查多个文字
            - ocr_click_same_row_text: 点击锚点文本同一行的目标文本
            - ocr_click_same_row_image: 点击锚点文本同一行的目标图片
            - ocr_check_same_row_text: 检查锚点文本同一行的目标文本是否存在，返回 {"exists": true, "position": [x,y]} 或 {"exists": false}，始终返回 SUCCESS 状态
            - ocr_check_same_row_image: 检查锚点文本同一行的目标图片是否存在，返回 {"exists": true, "position": [x,y]} 或 {"exists": false}，始终返回 SUCCESS 状态
            - ocr_get_position: 获取文字坐标列表，返回 {"positions": [[x1,y1], [x2,y2], ...]}

            【图像识别动作】
            - image_click: 点击匹配到的图像位置
            - image_wait: 等待指定图像出现
            - image_assert: 断言指定图像存在或不存在（negate: true 时断言不存在）
            - image_click_near_text: 点击文本附近最近的图像
            - image_move: 移动鼠标到匹配的图像位置（仅桌面端）
            - image_double_click: 双击匹配到的图像位置
            - image_exist: 检查图像是否存在，返回 {"exists": true/false}，始终返回 SUCCESS 状态
            - image_get_position: 获取图片坐标列表，返回 {"positions": [[x1,y1], [x2,y2], ...]}

            【坐标动作】
            - click: 点击指定坐标
            - right_click: 右键点击指定坐标（仅桌面端）
            - double_click: 双击指定坐标
            - move: 移动鼠标到指定坐标（仅桌面端）
            - swipe: 滑动手势
            - drag: 拖拽手势（与 swipe 参数相同）
            - input: 在指定坐标输入文本
            - paste: 直接粘贴文本（使用剪贴板 Ctrl+V，不点击坐标）

            【其他动作】
            - press: 按键操作
            - screenshot: 截图
            - wait: 固定等待
            - start_app: 启动应用/浏览器
            - stop_app: 关闭应用/浏览器
            - navigate: 跳转 URL（Web 专用）
            - new_page: 创建新空白标签页（Web 专用）
            - switched_page: 切换到指定页面（Web 专用）
            - close_page: 关闭当前页面（Web 专用）
            - get_token: 获取 Web 平台捕获的响应头 token
            - cmd_exec: 在宿主机执行 shell/cmd 命令
            - unlock_screen: 解锁屏幕（iOS/Android 专用）
            - pinch: 移动端双指缩放，value 为 in 或 out
            - activate_window: 激活窗口（Windows/Mac/Web 专用）
            - close_window: 关闭窗口/弹窗（Windows/Web 专用，PostMessage WM_CLOSE）
            - set_resolution: 设置显示器分辨率（Windows 专用）
            - set_volume: 设置系统音量（Windows 专用）
            - audio_device: 启用/停用音频设备（Windows 专用）
        level:
          type: string
          enum: [browser, system]
          default: browser
          description: |
            执行层级，仅 Web 平台支持，用于处理浏览器原生对话框等场景：
            - browser: 使用 Playwright 操作浏览器内部内容（默认）
            - system: 使用系统级操作（mss 截屏 + pyautogui 点击），可截取/操作原生对话框

            适用场景：
            - Web 会议共享桌面弹出的原生选择框（Playwright 无法截取）
            - 文件上传的原生文件选择器对话框
            - 浏览器权限请求弹窗等原生 UI

            示例：点击原生共享对话框中的"屏幕 1"
            {"action_type": "ocr_click", "value": "屏幕 1", "level": "system"}

            注意：system 级别需要安装 mss 和 pyautogui 依赖
        monitor:
          type: integer
          default: 1
          description: |
            截取哪个显示器，仅 Web 平台配合 level: system 使用：
            - 1: 主屏幕（自动识别 left=0 的显示器，即 Windows 设置中的主屏幕）
            - 2: 副屏幕（另一个显示器）

            自动识别规则：系统会自动找到 left=0 的显示器作为主屏幕，
            无需关心 mss 库的原始编号顺序。

            示例：截取第二个显示器上的原生对话框
            {"action_type": "ocr_click", "value": "确认", "level": "system", "monitor": 2}
        screenshot:
          type: boolean
          default: false
          description: "是否在该动作完成后附加截图附件"
        value:
          oneOf:
            - type: string
            - type: integer
            - type: array
              items:
                type: string
          description: |
            动作核心值，根据 action_type 不同含义不同：
            - ocr_click/ocr_input/ocr_wait/ocr_assert/ocr_exist: 要识别的文字内容
              - 支持 `reg_` 前缀正则匹配，如 `reg_\\d+` 匹配数字
              - OCR 统一匹配策略：精确匹配 → 模糊匹配，reg_ 前缀直接使用正则匹配
              - ocr_assert/ocr_exist 支持 list 传参批量验证：["文字1", "文字2", "文字3"]，一次 OCR 识别后批量检查
            - image_click_near_text: 要查找的目标文字
            - click/input: 此字段不使用（坐标由 x/y 指定）
            - paste: 要粘贴的文本内容
            - swipe: 此字段不使用
            - screenshot: 截图名称/标识
            - wait: 等待的毫秒数，如 "1000"
            - ocr_assert/ocr_exist: 单个文字或文字列表
            - pinch: 缩放方向，"in" 表示缩小，"out" 表示放大
            - set_volume: 音量百分比（0-100）
            - start_app: 应用包名或浏览器类型
              - Web: "chromium"、"firefox"、"webkit"
              - Android: 应用包名，如 "com.example.app"
              - iOS: Bundle ID，如 "com.example.app"
            - stop_app: 应用包名（可选，不填则关闭当前应用）
            - navigate: 要跳转的 URL
            - switched_page: 页面索引（从 1 开始），如 "1"、"2"、"3"
            - close_page: 此字段不使用
            - ocr_get_position: 要查找的文字内容（支持 reg_ 前缀正则匹配）
            - cmd_exec: 要执行的命令字符串，如 "echo hello" 或 "dir C:\\Users"
            - unlock_screen: 解锁密码（数字密码，如 "123456"）
            - activate_window: 窗口标题或窗口类名（支持包含匹配）
            - close_window: 窗口标题（match_by=title）或窗口类名（match_by=class）
        match_mode:
          type: string
          default: exact
          description: |
            OCR 匹配模式。默认使用精确匹配并按 OCR 服务策略降级为包含匹配；
            使用 regex 时会自动为未带前缀的表达式添加 reg_ 前缀。
        match_by:
          type: string
          enum: [title, class]
          default: title
          description: |
            窗口定位方式，activate_window / close_window 动作使用：
            - title: 按窗口标题匹配（包含匹配，如 "计算器" 匹配标题包含该文字的窗口）
            - class: 按窗口类名匹配（如 "Chrome_WidgetWin_1"、"Notepad"、"#32770"）

            平台支持：
            - Windows/Web: 支持 title 和 class 模式
            - Mac: 仅 activate_window 支持 class 模式（通过应用名激活）
        class:
          type: string
          description: "window_class 的兼容别名，仅用于 close_window 窗口类名定位"
        window_class:
          type: string
          description: |
            窗口类名（精确匹配），主要用于 close_window 与 title 组合精确定位：
            - 可与 value（标题）同时使用，避免 #32770 等通用对话框类名误关其他窗口
            - 示例：关闭标题含「声音」的系统对话框
              {"action_type": "close_window", "value": "声音", "window_class": "#32770"}
            - 也可使用短字段 "class"（与 window_class 等价）
        name:
          type: string
          description: |
            进程 exe 名称过滤，activate_window / close_window 动作可选：
            - 用于区分同名窗口类但不同进程的窗口
            - 如 "chrome.exe"、"msedge.exe"、"notepad.exe"
            - 不传则按原有逻辑查找，传了则只找指定 exe 进程的窗口

            使用场景：
            - Chrome_WidgetWin_1 是 Chrome 和 Edge 共用的窗口类名
            - 传 name="chrome.exe" 可确保只激活/关闭 Chrome 窗口，避免误操作 Edge

            示例：
            {"action_type": "activate_window", "value": "Chrome_WidgetWin_1", "match_by": "class", "name": "chrome.exe"}
            {"action_type": "close_window", "value": "声音", "window_class": "#32770", "name": "rundll32.exe"}
        proxy:
          type: string
          description: |
            代理配置字符串，仅 Web 平台 start_app 动作可选：
            - 格式："http://user:pass@proxy.example.com:8080"（带认证）
            - 格式："http://proxy.example.com:8080"（无认证）
            - 不传 proxy 参数：显式禁用代理，即使系统配置了代理也不会走系统代理
            - Playwright 使用 direct:// 模式禁用代理

            使用场景：
            - 测试需要通过代理访问的内部网站
            - 避免系统代理干扰测试环境

            示例：
            {"action_type": "start_app", "value": "chromium", "proxy": "http://admin:pwd123@proxy.internal.com:8080"}
        width:
          type: integer
          description: |
            分辨率宽度，仅 set_resolution 动作必填：
            - 设置显示器分辨率的宽度值，如 1920、1280
        height:
          type: integer
          description: |
            分辨率高度，仅 set_resolution 动作必填：
            - 设置显示器分辨率的高度值，如 1080、720
        monitor_index:
          type: integer
          default: 0
          description: |
            显示器索引，仅 set_resolution 动作可选：
            - 0: 主显示器（默认）
            - 1: 第二个显示器
            - 2: 第三个显示器
        device:
          type: string
          description: |
            设备名称或 ID，仅 audio_device 动作必填：
            - 音频设备名称（支持包含匹配），如 "扬声器"、"Realtek Audio"
            - 也可传入完整设备 ID
        state:
          type: string
          enum: [enable, disabled]
          description: |
            设备状态，仅 audio_device 动作必填：
            - enable: 启用音频设备
            - disabled: 停用音频设备
        text:
          type: string
          description: "输入/粘贴的文本内容，仅 ocr_input、input、paste 动作必填"
        wait:
          type: integer
          description: "动作前等待时间（毫秒）"
        time:
          type: integer
          description: "等待时间（秒），用于 ocr_wait/wait；优先使用 timeout 或 value 的动作参数"
        image_base64:
          type: string
          description: |
            图像模板 base64 编码，仅 image_* 动作必填：
            - image_click/image_wait/image_assert: 要匹配的图像模板
            - image_click_near_text: 要查找的图像模板
            - image_get_position: 要查找的图像模板
        index:
          type: integer
          default: 0
          description: |
            选择第几个匹配结果（从 0 开始），用于多个相同文字/图像的场景：
            - ocr_click/ocr_input/ocr_move/ocr_double_click: 点击第 N 个匹配的文字
            - ocr_assert/ocr_exist: 不支持 index 参数，list 模式下每个文字只检查是否存在
            - image_click/image_wait/image_assert/image_move/image_double_click/image_exist: 点击第 N 个匹配的图像
            示例：index=1 表示点击第二个匹配结果
        anchor_text:
          type: string
          description: |
            锚点文本，仅 ocr_*_same_row_* 动作必填：
            - ocr_click_same_row_text: 锚点文本用于定位水平行
            - ocr_click_same_row_image: 锚点文本用于定位水平行
            - ocr_check_same_row_text: 锚点文本用于定位水平行
            - ocr_check_same_row_image: 锚点文本用于定位水平行
        anchor_index:
          type: integer
          default: 0
          description: |
            锚点文本索引（从 0 开始），用于多个相同锚点文本的场景：
            - ocr_*_same_row_*: 选择第 N 个匹配的锚点文本
            示例：anchor_index=1 表示使用第二个匹配的锚点文本
        row_tolerance:
          type: integer
          default: 20
          description: |
            水平带范围（像素），仅 ocr_*_same_row_* 动作可用：
            - 定义锚点文本上下搜索范围，默认 20 像素
            - 例如 row_tolerance=20 表示在锚点 Y 坐标上下各 20 像素范围内搜索目标
        target_index:
          type: integer
          default: 0
          description: |
            目标索引（从 0 开始），仅 ocr_*_same_row_* 动作可用：
            - ocr_click_same_row_text/ocr_check_same_row_text: 选择同行第 N 个匹配的目标文本
            - ocr_click_same_row_image/ocr_check_same_row_image: 选择同行第 N 个匹配的目标图片
            示例：target_index=1 表示使用同行第二个匹配的目标
        region:
          type: array
          items:
            type: integer
          minItems: 4
          maxItems: 4
          description: |
            操作区域 [x1, y1, x2, y2]，限制 OCR/图像识别在指定矩形区域内执行：
            - x1, y1: 区域左上角坐标
            - x2, y2: 区域右下角坐标
            - 坐标必须为非负整数，且 x1 < x2、y1 < y2
            - 超出图像边界的部分会自动截断
            - 适用动作：所有 ocr_* 和 image_* 动作
            - 使用场景：多画面会场场景，只关注屏幕某一部分的变化
            示例：region=[960, 0, 1920, 540] 表示屏幕右半部分
        offset:
          type: object
          description: |
            相对于识别结果（文字/图像）中心的偏移量，用于微调点击位置：
            - x: 横向偏移（正值向右，负值向左）
            - y: 纵向偏移（正值向下，负值向上）
            示例：{"x": 100, "y": 0} 表示向右偏移 100 像素
          properties:
            x:
              type: integer
              description: "横向偏移（像素）"
            y:
              type: integer
              description: "纵向偏移（像素）"
        threshold:
          type: number
          default: 0.9
          description: "图像匹配阈值（0.0-1.0），仅用于 image_* 动作。值越高匹配越严格，默认 0.9"
        negate:
          type: boolean
          default: false
          description: |
            断言不存在，用于 ocr_assert、ocr_exist 和 image_assert 动作：
            - false（默认）: 断言元素存在，存在时 SUCCESS，不存在时 FAILED
            - true: 断言元素不存在，不存在时 SUCCESS，存在时 FAILED
            - list 场景：negate=true 要求所有文字都不存在才算通过（严格否定）
            示例：断言"错误提示"不存在 {"action_type": "ocr_assert", "value": "错误提示", "negate": true}
            示例：断言多个错误文字都不存在 {"action_type": "ocr_assert", "value": ["错误提示", "警告"], "negate": true}
        params:
          type: object
          description: |
            扩展参数，用于自定义动作。当前用于 pinch 手势动作：
            - scale: 缩放比例（默认 0.5）
            - duration: 持续时间（毫秒，默认 500）
        direction:
          type: string
          description: "滑动方向（部分平台兼容使用）；坐标滑动优先使用 x/y/end_x/end_y"
        app_path:
          type: string
          description: "应用路径，仅 Windows/Mac start_app 动作使用；不传时使用 value"
        restart:
          type: boolean
          default: false
          description: "是否先关闭再启动应用，仅 Windows/Mac start_app 动作使用"
        bundle_id:
          type: string
          description: "iOS 应用 Bundle ID；不传时使用 value"
        package_name:
          type: string
          description: "Android 应用包名；不传时使用 value"
        permissions:
          description: "Web start_app 的权限配置，例如 [camera, microphone] 或 false"
          oneOf:
            - type: boolean
            - type: string
            - type: array
              items:
                type: string
        fps:
          type: integer
          default: 10
          description: |
            帧率，仅 start_recording 动作使用（默认 10）
        audio:
          type: boolean
          default: false
          description: |
            是否录制音频，仅 start_recording 动作使用（默认 false）
        watermark:
          type: boolean
          default: true
          description: |
            是否开启时间水印，仅 start_recording 动作使用（默认 true）
        recording_timeout:
          type: integer
          default: 7200000
          description: |
            录屏超时时间（毫秒），仅 start_recording 动作使用（默认 7200000，即 2 小时）
        timeout:
          type: integer
          default: 30000
          description: |
            超时时间（毫秒），仅以下动作使用：
            - ocr_wait: 轮询等待文字出现的最大时间
            - image_wait: 轮询等待图像出现的最大时间
            - navigate: 页面加载超时（Web）
            - cmd_exec: 命令执行超时

            其他动作（如 ocr_click、ocr_assert、image_click、image_assert 等）不使用此参数。
        x:
          type: integer
          description: "X 坐标（像素），仅 click、right_click、move 和 input 动作必填"
        y:
          type: integer
          description: "Y 坐标（像素），仅 click、right_click、move 和 input 动作必填"
        end_x:
          type: integer
          description: |
            终点 X 坐标或扩展参数：
            - swipe: 滑动终点 X 坐标
            - image_click_near_text: 最大搜索距离（像素），默认 500
        end_y:
          type: integer
          description: |
            终点 Y 坐标：
            - swipe: 滑动终点 Y 坐标
        from:
          type: object
          description: "滑动起始坐标，仅 swipe 动作必填"
          properties:
            x:
              type: integer
              description: "起始点 X 坐标"
            y:
              type: integer
              description: "起始点 Y 坐标"
        to:
          type: object
          description: "滑动结束坐标，仅 swipe 动作必填"
          properties:
            x:
              type: integer
              description: "结束点 X 坐标"
            y:
              type: integer
              description: "结束点 Y 坐标"
        duration:
          type: integer
          description: "滑动/拖拽/缩放持续时间（毫秒），默认 500ms"
        click_duration:
          type: integer
          description: |
            点击持续时间（毫秒），用于实现长按效果：
            - 0: 普通点击（默认）
            - >0: 长按指定时间，如 2000 表示长按 2 秒
            适用动作：ocr_click、image_click、click、ocr_input、ocr_click_same_row_text、ocr_click_same_row_image、image_click_near_text
            示例：长按 2 秒 {"action_type": "ocr_click", "value": "确认", "click_duration": 2000}
        steps:
          type: integer
          description: |
            滑动步数，控制轨迹平滑度。默认使用 5 实现平滑滑动：
            - steps 越大，轨迹越平滑，接近真实手指滑动
            - Android: 1 步约 5ms，steps=10 总耗时约 50ms
            - iOS: WDA 不支持 steps 参数，始终使用 duration
            适用动作：swipe、drag
            示例：平滑滑动 {"action_type": "swipe", "x": 100, "y": 500, "end_x": 100, "end_y": 100, "steps": 10}
        key:
          type: string
          description: |
            按键名称，仅 press 动作必填。不同平台支持的按键不同：

            【Web/Windows/Mac 桌面端】支持所有标准键盘按键：
            - 功能键: Enter、Escape、Tab、Backspace、Delete
            - 方向键: ArrowUp、ArrowDown、ArrowLeft、ArrowRight
            - 修饰键: Control、Alt、Shift、Meta
            - 组合键示例: Control+A、Control+C、Alt+F4

            【Android 移动端】支持的按键：
            - 导航键: Home（主屏幕）、Back（返回）、Menu（菜单）、Search（搜索）
            - 功能键: Enter、Escape、Tab、Backspace、Delete
            - 方向键: ArrowUp、ArrowDown、ArrowLeft、ArrowRight
            - 音量键: Volume_Up、Volume_Down
            - 电源键: Power、Lock（锁屏）
            - 媒体键: Media_Play_Pause、Media_Stop、Media_Next、Media_Previous
            - 数字 KeyCode: 直接传入数字，如 "26" 表示电源键

            【iOS 移动端】支持的按键（取决于设备型号）：
            - iPhone 8 (Touch ID): Home、Volume_Up、Volume_Down
            - iPhone X+ (Face ID): 可能支持更多按键
            - 不支持的按键: Back、Enter、Escape、Lock 等（iOS 无物理键）
              → Back: 请使用 OCR 点击导航栏返回按钮
              → Enter: 请使用 OCR 点击键盘上的完成/搜索按钮
        background:
          type: boolean
          default: false
          description: "仅 cmd_exec 使用；为 true 时后台启动命令并立即返回，不等待命令完成"
      example:
        action_type: "ocr_wait"
        value: "加载完成"
        timeout: 10000

    WorkerError:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          description: "稳定错误码，例如 DEVICE_BUSY、IDEMPOTENCY_CONFLICT、TASK_NOT_FOUND"
        message:
          type: string
          description: "面向调用方的错误信息"
        retryable:
          type: boolean
          description: "Worker 是否建议重试；业务错误不会由 testcase 自动重放动作"
        details:
          type: object
          additionalProperties: true
          description: "错误上下文，例如 busy_task_id、task_id 或 idempotency_key"
    TaskResult:
      type: object
      description: "任务执行结果。同步执行时不包含 task_id 字段"
      properties:
        task_id:
          type: string
          description: "任务 ID（仅异步执行返回）"
        status:
          type: string
          enum: [pending, running, success, failed, timeout, cancelled, interrupted]
          description: "任务状态"
        platform:
          type: string
          description: "平台"
        started_at:
          type: string
          format: date-time
          description: "开始时间"
        finished_at:
          type: string
          format: date-time
          description: "结束时间"
        duration_ms:
          type: integer
          description: "执行耗时(ms)"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionResult"
        metadata:
          type: object
          description: "任务元数据（扩展信息）"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactRef"
          description: "截图、录屏和失败附件的引用；附件按 Worker 保留策略自动清理"
        error:
          type: string
          description: "错误信息"
        error_screenshot:
          type: string
          description: "失败截图（base64 编码）"
        request_id:
          type: string
          description: "请求追踪 ID"

    ActionResult:
      type: object
      properties:
        number:
          type: integer
          description: "动作序号（在任务列表中的位置，从 0 开始）"
        action_type:
          type: string
          description: "动作类型"
        status:
          type: string
          enum: [pending, running, success, failed, skipped]
          description: "动作状态"
        duration_ms:
          type: integer
          description: "执行耗时(ms)"
        output:
          type: string
          nullable: true
          description: |
            输出内容；当前运行时以字符串返回，部分动作会将结构化结果序列化为 JSON 字符串。
        error:
          type: string
          description: "错误信息"
        screenshot:
          type: string
          description: "截图（base64 或路径）"
        exit_code:
          type: integer
          description: "命令退出码（仅 cmd_exec 动作返回），0 表示成功"
        stdout:
          type: string
          description: "命令标准输出（仅 cmd_exec 动作返回）"
        stderr:
          type: string
          description: "命令标准错误输出（仅 cmd_exec 动作返回）"
        request_id:
          type: string
          description: "请求追踪 ID"
        ocr_info:
          type: array
          items:
            type: object
            additionalProperties: true
          description: "OCR 失败时返回的识别信息"
        timestamp:
          type: number
          format: double
          description: "点击类动作执行时间（Unix 时间戳）"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactRef"
          description: "该动作生成的附件引用"

  # ==================== 动作类型详细示例 ====================
  # 以下为各动作类型的完整传参示例，供调用方参考

  # ---------- OCR 文字识别动作 ----------
  # ocr_click - 点击识别到的文字
  # 示例 1: 点击"登录"按钮
  # {"action_type": "ocr_click", "value": "登录"}
  # 示例 2: 点击"登录"按钮并向右偏移 100 像素（适用于文字右侧有按钮）
  # {"action_type": "ocr_click", "value": "登录", "offset": {"x": 100, "y": 0}}
  # 示例 3: 点击第二个"确定"按钮（index 从 0 开始）
  # {"action_type": "ocr_click", "value": "确定", "index": 1}
  # 示例 4: 仅在屏幕右半部分查找并点击"会场名称"
  # {"action_type": "ocr_click", "value": "会场名称", "region": [960, 0, 1920, 540]}
  # 示例 5: 长按"确认"按钮 2 秒
  # {"action_type": "ocr_click", "value": "确认", "click_duration": 2000}

  # ocr_input - 在文字附近输入文本
  # 示例 1: 在"用户名"标签右侧输入账号
  # {"action_type": "ocr_input", "value": "用户名", "text": "admin", "offset": {"x": 80, "y": 0}}
  # 示例 2: 在第二个"输入框"附近输入内容
  # {"action_type": "ocr_input", "value": "输入框", "text": "hello", "index": 1}

  # ocr_wait - 等待文字出现
  # 示例: 等待"加载完成"出现，最多等 10 秒
  # {"action_type": "ocr_wait", "value": "加载完成", "timeout": 10000}

  # ocr_assert - 断言文字存在或不存在（单次截图断言，不使用 timeout）
  # 示例 1: 断言"操作成功"文字存在
  # {"action_type": "ocr_assert", "value": "操作成功"}
  # 示例 2: 断言"错误提示"文字不存在
  # {"action_type": "ocr_assert", "value": "错误提示", "negate": true}
  # 示例 3: 批量断言多个文字都存在（list 传参，一次 OCR 识别）
  # {"action_type": "ocr_assert", "value": ["用户名", "密码", "登录"]}
  # 示例 4: 批量断言多个文字都不存在
  # {"action_type": "ocr_assert", "value": ["错误提示", "警告"], "negate": true}

  # ocr_get_text - 获取屏幕所有文字
  # 示例: 获取当前屏幕文字内容
  # {"action_type": "ocr_get_text", "value": ""}

  # ocr_move - 移动鼠标到识别到的文字位置（仅桌面端支持）
  # 示例 1: 移动鼠标到"登录"文字位置
  # {"action_type": "ocr_move", "value": "登录"}
  # 示例 2: 移动鼠标到"设置"文字右侧
  # {"action_type": "ocr_move", "value": "设置", "offset": {"x": 50, "y": 0}}
  # 示例 3: 移动鼠标到第二个"确定"文字位置
  # {"action_type": "ocr_move", "value": "确定", "index": 1}

  # ocr_double_click - 双击识别到的文字
  # 示例 1: 双击"文件"文字
  # {"action_type": "ocr_double_click", "value": "文件"}
  # 示例 2: 双击第二个"确定"文字
  # {"action_type": "ocr_double_click", "value": "确定", "index": 1}
  # 示例 3: 双击文字并向右偏移
  # {"action_type": "ocr_double_click", "value": "文件", "offset": {"x": 50, "y": 0}}

  # ocr_exist - 检查文字是否存在
  # 返回 {"exists": true} 或 {"exists": false}，无论是否存在都返回 SUCCESS 状态
  # 示例 1: 检查"登录"文字是否存在
  # {"action_type": "ocr_exist", "value": "登录"}
  # 示例 2: 批量检查多个文字是否存在（list 传参，一次 OCR 识别，全部存在才返回 true）
  # {"action_type": "ocr_exist", "value": ["首页", "设置", "帮助"]}
  # 示例 3: 使用正则匹配检查是否存在数字
  # {"action_type": "ocr_exist", "value": "reg_\\d+"}

  # ocr_click_same_row_text - 点击锚点文本同一行的目标文本
  # 示例 1: 点击"功能名称B"同一行的"开关"文字
  # {"action_type": "ocr_click_same_row_text", "anchor_text": "功能名称B", "value": "开关"}
  # 示例 2: 点击第二个锚点文本同一行的目标，水平带范围 30 像素
  # {"action_type": "ocr_click_same_row_text", "anchor_text": "功能名称", "anchor_index": 1, "value": "开关", "row_tolerance": 30}
  # 示例 3: 点击锚点同一行的第二个目标文本，并偏移
  # {"action_type": "ocr_click_same_row_text", "anchor_text": "功能名称B", "value": "开关", "target_index": 1, "offset": {"x": 10, "y": 0}}

  # ocr_click_same_row_image - 点击锚点文本同一行的目标图片
  # 示例 1: 点击"功能名称B"同一行的开关图标
  # {"action_type": "ocr_click_same_row_image", "anchor_text": "功能名称B", "image_base64": "<base64_encoded_image>", "threshold": 0.8}
  # 示例 2: 点击第二个锚点文本同一行的图片，水平带范围 30 像素
  # {"action_type": "ocr_click_same_row_image", "anchor_text": "功能名称", "anchor_index": 1, "image_base64": "<base64_encoded_image>", "row_tolerance": 30}

  # ocr_check_same_row_text - 检查锚点文本同一行的目标文本是否存在
  # 返回格式: {"exists": true, "position": [x,y]} 或 {"exists": false}，始终返回 SUCCESS 状态（即使目标不存在）
  # 示例 1: 检查"功能名称B"同一行是否有"开关"文字
  # {"action_type": "ocr_check_same_row_text", "anchor_text": "功能名称B", "value": "开关"}
  # 示例 2: 检查第二个锚点文本同一行的目标，水平带范围 30 像素
  # {"action_type": "ocr_check_same_row_text", "anchor_text": "功能名称", "anchor_index": 1, "value": "开关", "row_tolerance": 30}

  # ocr_check_same_row_image - 检查锚点文本同一行的目标图片是否存在
  # 返回格式: {"exists": true, "position": [x,y]} 或 {"exists": false}，始终返回 SUCCESS 状态（即使目标不存在）
  # 示例 1: 检查"功能名称B"同一行是否有开关图标
  # {"action_type": "ocr_check_same_row_image", "anchor_text": "功能名称B", "image_base64": "<base64_encoded_image>", "threshold": 0.8}
  # 示例 2: 检查第二个锚点文本同一行的图片
  # {"action_type": "ocr_check_same_row_image", "anchor_text": "功能名称", "anchor_index": 1, "image_base64": "<base64_encoded_image>"}

  # ---------- 图像识别动作 ----------
  # image_click - 点击匹配的图像
  # 示例 1: 点击图像，匹配阈值 0.9
  # {"action_type": "image_click", "image_base64": "<base64_encoded_image>", "threshold": 0.9}
  # 示例 2: 点击第二个匹配的图像
  # {"action_type": "image_click", "image_base64": "<base64_encoded_image>", "index": 1}
  # 示例 3: 仅在屏幕左上四分之一区域查找并点击图像
  # {"action_type": "image_click", "image_base64": "<base64_encoded_image>", "region": [0, 0, 960, 540]}
  # 示例 4: 长按图像 2 秒
  # {"action_type": "image_click", "image_base64": "<base64_encoded_image>", "click_duration": 2000}

  # image_wait - 等待图像出现
  # 示例 1: 等待图像出现，最多等 8 秒
  # {"action_type": "image_wait", "image_base64": "<base64_encoded_image>", "timeout": 8000, "threshold": 0.85}
  # 示例 2: 等待第二个匹配的图像出现
  # {"action_type": "image_wait", "image_base64": "<base64_encoded_image>", "index": 1}

  # image_assert - 断言图像存在或不存在（单次截图断言，不使用 timeout）
  # 示例 1: 断言图像存在
  # {"action_type": "image_assert", "image_base64": "<base64_encoded_image>", "threshold": 0.8}
  # 示例 2: 断言第二个匹配的图像存在
  # {"action_type": "image_assert", "image_base64": "<base64_encoded_image>", "index": 1}
  # 示例 3: 断言图像不存在
  # {"action_type": "image_assert", "image_base64": "<base64_encoded_image>", "negate": true}

  # image_click_near_text - 点击文本附近最近的图像
  # 示例: 点击"密码"文字附近 500 像素范围内的输入框图标
  # {"action_type": "image_click_near_text", "image_base64": "<base64_encoded_image>", "value": "密码", "end_x": 500}

  # image_move - 移动鼠标到匹配的图像位置（仅桌面端支持）
  # 示例 1: 移动鼠标到图像位置，匹配阈值 0.9
  # {"action_type": "image_move", "image_base64": "<base64_encoded_image>", "threshold": 0.9}
  # 示例 2: 移动鼠标到图像位置并向右偏移 20 像素
  # {"action_type": "image_move", "image_base64": "<base64_encoded_image>", "offset": {"x": 20, "y": 0}}
  # 示例 3: 移动鼠标到第二个匹配的图像位置
  # {"action_type": "image_move", "image_base64": "<base64_encoded_image>", "index": 1}

  # image_double_click - 双击匹配的图像位置
  # 示例 1: 双击图像，匹配阈值 0.9
  # {"action_type": "image_double_click", "image_base64": "<base64_encoded_image>", "threshold": 0.9}
  # 示例 2: 双击第二个匹配的图像
  # {"action_type": "image_double_click", "image_base64": "<base64_encoded_image>", "index": 1}
